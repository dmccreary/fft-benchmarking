<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Graph Viewer for Benchmarking FFT</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="graph-viewer.js" defer></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            margin: 0;
            padding: 10px;
        }

        #sidebar-container {
            display: flex;
            flex-direction: column;
        }

        #toggle-button {
            width: 30px;
            height: 30px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 18px;
        }

        #sidebar {
            width: 200px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        #sidebar.collapsed {
            display: none;
        }

        #sidebar h3 {
            margin-top: 0;
            font-size: 14px;
        }

        #sidebar table {
            width: 100%;
            border-collapse: collapse;
        }

        #sidebar td {
            padding: 3px 5px;
            border-bottom: 1px solid #eee;
        }

        #sidebar .color-box {
            width: 20px;
            height: 16px;
            display: inline-block;
            border: 1px solid #999;
            vertical-align: middle;
        }

        #main {
            flex: 1;
            padding: 0 10px;
        }

        #search-container {
            margin-bottom: 10px;
        }

        #search-input {
            width: 300px;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #search-results {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            width: 300px;
            z-index: 1000;
            display: none;
        }

        .search-result-item {
            padding: 8px;
            cursor: pointer;
        }

        .search-result-item:hover {
            background-color: #f0f0f0;
        }

        #stats {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        #mynetwork {
            width: 100%;
            height: 700px;
            background-color: aliceblue;
            border: 1px solid lightgray;
        }

        .check-controls {
            margin-bottom: 10px;
        }

        .check-controls button {
            font-size: 11px;
            padding: 3px 8px;
            margin-right: 5px;
            cursor: pointer;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }

        .legend-item input {
            margin-right: 5px;
        }

        .legend-item label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="sidebar-container">
        <button id="toggle-button" onclick="toggleSidebar()">&#9776;</button>
        <div id="sidebar">
            <h3>Categories</h3>
            <div class="check-controls">
                <button onclick="checkAll()">Check All</button>
                <button onclick="uncheckAll()">Uncheck All</button>
            </div>
            <div id="legend-container">
                <!-- Legend items will be dynamically generated -->
            </div>
        </div>
    </div>

    <div id="main">
        <h4>Learning Graph for Benchmarking FFT</h4>

        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search concepts..." oninput="searchConcepts(this.value)">
            <div id="search-results"></div>
        </div>

        <div id="stats">
            Visible: <span id="visible-nodes">0</span> nodes, <span id="visible-edges">0</span> edges |
            Foundational: <span id="foundational-count">0</span>
        </div>

        <div id="mynetwork"></div>

        <p><a href=".">Return to lesson plan</a></p>
    </div>

    <script>
        window.onload = function() {
            initGraph();
        };
    </script>
</body>
</html>
