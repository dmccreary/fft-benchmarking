<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Linear Sqrt Decibel Scaling Chart MicroSim using Chart.js</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="chart-box">
            <canvas id="scalingChart"></canvas>
        </div>
        <div class="controls">
            <label><input type="radio" name="mode" value="linear" checked> Linear (power)</label>
            <label><input type="radio" name="mode" value="sqrt"> Square root (magnitude)</label>
            <label><input type="radio" name="mode" value="db"> Decibel</label>
        </div>
        <div class="caption" id="caption"></div>
    </main>
    <script src="linear-sqrt-decibel-scaling-chart.js"></script>
</body>
</html>
